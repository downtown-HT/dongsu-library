<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인천동수중학교 책사랑 도서관 - 희망도서 신청</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="pb-16 text-slate-800">

  <!-- 헤더 영역 -->
  <header class="bg-[#1e3a8a] text-white shadow-lg p-6 md:p-8">
    <div class="max-w-4xl mx-auto flex items-center space-x-3">
      <div class="w-10 h-10 rounded-full bg-white text-blue-900 flex items-center justify-center font-black text-xl shadow">東</div>
      <div>
        <h2 class="text-xs text-blue-200 tracking-wider">Incheon Dongsu Middle School</h2>
        <h1 class="text-2xl font-bold">인천동수중학교 책사랑 도서관</h1>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-8 space-y-8">

    <!-- 1단계: 교내 소장도서 자체 DB 검색 -->
    <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
      <h2 class="text-blue-800 font-bold text-lg mb-2">1단계: 먼저 우리 도서관에 있는지 확인해보세요</h2>
      <p class="text-sm text-slate-500 mb-4">
        도서명이나 저자명을 검색해 소장 여부를 확인하세요. 이미 소장 중인 책은 신청할 수 없습니다.
      </p>

      <div class="flex gap-2 mb-4">
        <input type="text" id="ownedSearchInput" placeholder="도서명 또는 저자명 입력" class="flex-1 px-4 py-2 text-sm border rounded-xl border-slate-300 focus:ring-2 focus:ring-blue-600 outline-none">
        <button type="button" onclick="searchOwnedBooks()" class="px-5 py-2 bg-slate-800 hover:bg-slate-900 text-white text-sm font-bold rounded-xl transition">검색</button>
      </div>
      
      <!-- 소장도서 검색 결과 박스 -->
      <div id="ownedResultBox" class="hidden">
        <div id="ownedResultList" class="space-y-2 max-h-56 overflow-y-auto"></div>
      </div>
    </section>

    <!-- 2단계: 신청폼 -->
    <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
      <h2 class="text-blue-800 font-bold text-lg mb-4">2단계: 도서 검색 & 신청서 작성</h2>
      
      <!-- 알라딘 도서 검색 영역 -->
      <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 mb-6 flex gap-2">
        <input type="text" id="aladinQuery" placeholder="신청할 도서명 입력 (자동완성 검색)" class="flex-1 px-4 py-2 text-sm border rounded-xl border-blue-200 focus:ring-2 focus:ring-blue-600 outline-none">
        <button type="button" onclick="searchAladinBook()" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold rounded-xl transition">알라딘 검색</button>
      </div>
      
      <!-- 알라딘 검색 결과 박스 -->
      <div id="aladinResults" class="mb-4 space-y-2 max-h-60 overflow-y-auto hidden"></div>

      <!-- 희망도서 신청 폼 -->
      <form id="wishForm" onsubmit="submitWishlist(event)" class="space-y-4">
        
        <!-- 신청자 정보 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <select id="role" class="border p-2 text-sm rounded bg-white">
            <option value="학생">학생</option>
            <option value="교사">교사</option>
          </select>
          <input type="text" id="name" required placeholder="이름 (필수)" class="border p-2 text-sm rounded bg-white">
          <input type="text" id="grade" placeholder="학년/반 (선택)" class="border p-2 text-sm rounded bg-white">
        </div>

        <hr class="border-slate-100 my-4">

        <!-- 도서 상세 정보 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <input type="text" id="title" required placeholder="도서명 (필수)" class="border p-2 text-sm rounded bg-slate-50 md:col-span-2">
          <input type="text" id="author" required placeholder="저자 (필수)" class="border p-2 text-sm rounded bg-slate-50">
          <input type="text" id="publisher" required placeholder="출판사 (필수)" class="border p-2 text-sm rounded bg-slate-50">
          <input type="text" id="price" placeholder="정가" class="border p-2 text-sm rounded bg-slate-50">
          <input type="text" id="isbn" placeholder="ISBN" class="border p-2 text-sm rounded bg-slate-50">
        </div>

        <textarea id="reason" rows="3" placeholder="신청 사유(선택) - 왜 이 책을 읽고 싶은지 적어주세요." class="w-full border p-2 text-sm rounded mt-4"></textarea>
        
        <button type="submit" id="submitBtn" class="w-full py-3 mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition">
          희망도서 신청하기
        </button>
      </form>
    </section>
  </main>

  <footer class="text-center text-xs text-slate-400 mt-12 pb-8">
    <p>인천동수중학교 책사랑 도서관 📖</p>
  </footer>

  <!-- 자바스크립트 코드 영역 (반드시 여기에 위치해야 합니다) -->
  <script>
    // ★★★ 중요: 여기에 메모장에 적어둔 본인의 웹 앱 URL을 따옴표 안에 꼭 붙여넣으세요! ★★★
    const GAS_URL = "https://script.google.com/macros/s/AKfycbz4Hc84Kji36UrBVqdAY_B7NRDvNrIQ77Bc4VXnt7zu2RdQvq7G5b_p4e45QnigHHNp/exec"; 
    
    // 1. 소장도서(구글시트 DB) 검색 기능
    async function searchOwnedBooks() {
      const q = document.getElementById('ownedSearchInput').value.trim();
      if (!q) return alert("검색할 책 제목을 입력해주세요.");

      const resultBox = document.getElementById('ownedResultBox');
      const list = document.getElementById('ownedResultList');
      resultBox.classList.remove('hidden');
      list.innerHTML = `<div class="p-3 text-center text-xs text-slate-400">도서관 서재를 뒤지는 중입니다...</div>`;

      try {
        const res = await fetch(`${GAS_URL}?action=searchOwned&query=${encodeURIComponent(q)}`);
        const json = await res.json();
        
        if (json.data && json.data.length > 0) {
          list.innerHTML = json.data.map(b => `
            <div class="p-3 bg-amber-50 border border-amber-200 rounded-lg text-sm flex justify-between items-center">
              <div>
                <span class="font-bold text-amber-900">${b.title}</span> 
                <span class="text-slate-600">(${b.author} | ${b.publisher})</span>
                <div class="text-xs text-slate-500 mt-1">출판년도: <b>${b.year || '-'}</b> | ISBN: ${b.isbn || '-'}</div>
              </div>
              <span class="bg-amber-200 text-amber-900 px-2 py-1 rounded text-[11px] font-bold shrink-0">소장중</span>
            </div>
          `).join('');
        } else {
          list.innerHTML = `<div class="p-3 bg-emerald-50 text-emerald-800 border border-emerald-200 rounded-lg text-sm font-bold flex items-center gap-2">🎉 '${q}' 은(는) 도서관에 없는 책입니다. 아래에서 신청을 진행해주세요!</div>`;
        }
      } catch (err) {
        list.innerHTML = `<div class="text-red-500 text-sm p-3">검색 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.</div>`;
      }
    }

    // 2. 알라딘 도서 검색 기능
    function searchAladinBook() {
      const q = document.getElementById('aladinQuery').value.trim();
      if (!q) return alert("도서명을 입력하세요.");

      const resBox = document.getElementById('aladinResults');
      resBox.classList.remove('hidden');
      resBox.innerHTML = `<div class="p-3 text-center text-xs text-slate-400">알라딘 서점에서 찾는 중입니다...</div>`;

      const script = document.createElement('script');
      window.aladinCb = function(data) {
        if (!data.item || data.item.length === 0) {
          resBox.innerHTML = `<div class="p-3 text-xs text-slate-500 text-center">검색 결과가 없습니다. 도서명을 직접 입력해주세요.</div>`;
          return;
        }
        resBox.innerHTML = data.item.map(i => `
          <div onclick='selBook(${JSON.stringify(i).replace(/'/g,"&apos;")})' class="p-3 bg-white border border-slate-200 hover:border-blue-500 rounded-lg cursor-pointer flex gap-3 items-center transition">
            <img src="${i.cover || 'https://via.placeholder.com/50x70'}" class="w-10 h-14 object-cover rounded shadow-sm">
            <div class="text-xs flex-1">
              <div class="font-bold text-slate-800">${i.title}</div>
              <div class="text-slate-500">${i.author} | ${i.publisher}</div>
              <div class="text-blue-600 font-semibold mt-0.5">${Number(i.priceStandard||0).toLocaleString()}원</div>
            </div>
            <button type="button" class="text-xs bg-blue-50 text-blue-600 px-2.5 py-1 rounded font-medium shrink-0">선택</button>
          </div>
        `).join('');
      };
      
      script.src = `https://www.aladin.co.kr/ttb/api/ItemSearch.aspx?ttbkey=ttbtest12345678001&Query=${encodeURIComponent(q)}&output=JS&callback=aladinCb&Version=20131101`;
      document.body.appendChild(script);
    }

    // 3. 검색된 알라딘 도서 선택 시 폼에 자동 입력
    function selBook(b) {
      document.getElementById('title').value = b.title || ''; 
      document.getElementById('author').value = b.author || '';
      document.getElementById('publisher').value = b.publisher || ''; 
      document.getElementById('price').value = b.priceStandard ? Number(b.priceStandard).toLocaleString() : '';
      document.getElementById('isbn').value = b.isbn13 || b.isbn || ''; 
      document.getElementById('aladinResults').classList.add('hidden');
      alert(`[${b.title}] 정보가 폼에 자동 입력되었습니다.`);
    }

    // 4. 희망도서 신청서 최종 전송
    async function submitWishlist(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = "전송중...";
      btn.disabled = true;

      const payload = {
        action: "addRequest", 
        role: document.getElementById('role').value, 
        name: document.getElementById('name').value,
        gradeClass: document.getElementById('grade').value, 
        title: document.getElementById('title').value,
        author: document.getElementById('author').value, 
        publisher: document.getElementById('publisher').value,
        price: document.getElementById('price').value, 
        isbn: document.getElementById('isbn').value, 
        reason: document.getElementById('reason').value
      };
      
      try {
        await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) });
        alert("희망도서 신청이 완료되었습니다!");
        document.getElementById('wishForm').reset();
        document.getElementById('ownedResultBox').classList.add('hidden');
      } catch (err) {
        alert("통신 오류가 발생했습니다. 관리자에게 문의하세요.");
      } finally {
        btn.innerText = "희망도서 신청하기";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
