<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>인천동수중학교 책사랑 도서관</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Pretendard', 'sans-serif'] },
          colors: {
            dsNavy: '#2b3b7c',   
            dsSky: '#d0ecfc',    
            dsYellow: '#f3c431', 
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #f4f8fb; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    * { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="text-slate-800 antialiased pb-12 md:pb-20">

  <header class="bg-dsNavy text-white rounded-b-[2rem] md:rounded-b-[2.5rem] shadow-lg pb-12 pt-8 px-4 md:px-6 relative overflow-hidden">
    <div class="absolute -top-10 -right-10 w-32 h-32 md:w-40 md:h-40 bg-dsSky rounded-full opacity-20 blur-2xl"></div>
    <div class="max-w-4xl mx-auto flex flex-col md:flex-row items-center gap-4 md:gap-5 text-center md:text-left relative z-10">
      <div class="flex-shrink-0">
        <img src="다운로드.jfif" alt="인천동수중학교 로고" class="w-20 h-20 md:w-24 md:h-24 object-contain bg-white rounded-full p-1.5 shadow-md">
      </div>
      <div class="w-full">
        <h2 class="text-dsSky font-semibold tracking-wider text-[11px] md:text-sm mb-1">Incheon Dongsu Middle School</h2>
        <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight break-keep">인천동수중학교 책사랑 도서관 ✨</h1>
        <p class="mt-2 text-blue-100 text-xs md:text-sm font-medium break-keep opacity-90">읽고 싶은 책이 도서관에 없다면 신청해주세요!<br class="block md:hidden"> 새 책으로 만나게 해드릴게요.</p>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 -mt-6 md:-mt-8 space-y-5 md:space-y-6 relative z-20">
    <!-- 1단계: 자체 DB 검색 -->
    <section class="bg-white rounded-2xl md:rounded-3xl p-5 md:p-8 shadow-sm border border-slate-100">
      <div class="flex items-center gap-2 mb-2">
        <span class="bg-dsNavy text-white text-[10px] md:text-xs font-bold px-2.5 py-1 rounded-full">STEP 1</span>
        <h2 class="text-dsNavy font-bold text-lg md:text-xl break-keep">우리 도서관에 있는 책일까요? 🧐</h2>
      </div>
      <p class="text-xs md:text-sm text-slate-500 mb-4 md:mb-5 ml-1 break-keep">도서명이나 저자명을 검색해보세요. 이미 있는 책은 바로 빌릴 수 있어요!</p>

      <div class="flex flex-col sm:flex-row gap-2 mb-2">
        <input type="text" id="ownedSearchInput" placeholder="도서명 또는 저자명 검색" class="w-full sm:flex-1 px-4 py-3 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-dsSky focus:border-dsNavy outline-none transition" onkeydown="if(event.key==='Enter') searchOwnedBooks()">
        <button type="button" onclick="searchOwnedBooks()" class="w-full sm:w-auto px-6 py-3 bg-dsNavy text-white text-sm font-bold rounded-xl active:scale-95 transition shadow-sm">검색</button>
      </div>
      <div id="ownedResultBox" class="hidden mt-4 bg-slate-50 rounded-xl p-2 border border-slate-100">
        <div id="ownedResultList" class="space-y-2 max-h-52 overflow-y-auto pr-1"></div>
      </div>
    </section>

    <!-- 2단계: 희망도서 신청폼 -->
    <section class="bg-white rounded-2xl md:rounded-3xl p-5 md:p-8 shadow-sm border border-slate-100">
      <div class="flex items-center gap-2 mb-2">
        <span class="bg-dsYellow text-dsNavy text-[10px] md:text-xs font-bold px-2.5 py-1 rounded-full">STEP 2</span>
        <h2 class="text-dsNavy font-bold text-lg md:text-xl break-keep">희망도서 검색 & 신청서 작성 📝</h2>
      </div>
      <p class="text-xs md:text-sm text-slate-500 mb-5 md:mb-6 ml-1 break-keep">도서관에 없는 책이라면 검색 후 신청서를 내주세요.</p>
      
      <!-- 카카오 도서 검색 -->
      <div class="bg-dsSky/30 p-4 md:p-5 rounded-xl border border-dsSky/50 mb-5 md:mb-6">
        <label class="block text-[11px] md:text-xs font-bold text-dsNavy mb-2 ml-1">📚 카카오 도서 검색</label>
        <div class="flex flex-col sm:flex-row gap-2">
          <input type="text" id="kakaoQuery" placeholder="신청하고 싶은 책 제목 입력" class="w-full sm:flex-1 px-4 py-3 text-sm bg-white border border-white rounded-xl focus:ring-2 focus:ring-dsNavy outline-none shadow-sm transition" onkeydown="if(event.key==='Enter') searchKakaoBook()">
          <button type="button" onclick="searchKakaoBook()" class="w-full sm:w-auto px-6 py-3 bg-dsNavy text-white text-sm font-bold rounded-xl shadow-sm active:scale-95 transition">책 찾기</button>
        </div>
        <div id="kakaoResults" class="mt-3 md:mt-4 space-y-2 max-h-60 overflow-y-auto hidden pr-1"></div>
      </div>

      <form id="wishForm" onsubmit="submitWishlist(event)" class="space-y-4 md:space-y-5">
        <div class="bg-slate-50 p-4 md:p-5 rounded-xl border border-slate-100">
          <h3 class="text-xs md:text-sm font-bold text-slate-700 mb-3">나의 정보</h3>
          <div class="grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-4">
            <select id="role" class="border border-slate-200 p-2.5 md:p-3 text-sm rounded-lg md:rounded-xl bg-white outline-none col-span-2 md:col-span-1">
              <option value="학생">학생</option>
              <option value="교사">선생님</option>
            </select>
            <input type="text" id="name" required placeholder="이름 (필수)" class="border border-slate-200 p-2.5 md:p-3 text-sm rounded-lg md:rounded-xl bg-white outline-none col-span-2 md:col-span-1">
            <input type="text" id="grade" placeholder="학년/반 (선택)" class="border border-slate-200 p-2.5 md:p-3 text-sm rounded-lg md:rounded-xl bg-white outline-none col-span-2 md:col-span-1">
          </div>
        </div>

        <div class="bg-slate-50 p-4 md:p-5 rounded-xl border border-slate-100">
          <h3 class="text-xs md:text-sm font-bold text-slate-700 mb-3">신청할 도서 정보</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4">
            <input type="text" id="title" required placeholder="도서명 (필수)" class="border border-slate-200 p-2.5 md:p-3 text-sm rounded-lg md:rounded-xl bg-white md:col-span-2 outline-none font-bold text-dsNavy">
            <input type="text" id="author" required placeholder="저자 (필수)" class="border border-slate-200 p-2.5 md:p-3 text-sm rounded-lg md:rounded-xl bg-white outline-none">
            <input type="text" id="publisher" required placeholder="출판사 (필수)" class="border border-slate-200 p-2.5 md:p-3 text-sm rounded-lg md:rounded-xl bg-white outline-none">
            <input type="text" id="price" placeholder="정가 (자동입력)" class="border border-slate-200 p-2.5 md:p-3 text-sm rounded-lg md:rounded-xl bg-slate-100 outline-none text-slate-500" readonly>
            <input type="text" id="isbn" placeholder="ISBN (자동입력)" class="border border-slate-200 p-2.5 md:p-3 text-sm rounded-lg md:rounded-xl bg-slate-100 outline-none text-slate-400" readonly>
          </div>
          <textarea id="reason" rows="3" placeholder="이 책을 읽고 싶은 이유를 적어주세요! (선택)" class="w-full border border-slate-200 p-3 md:p-4 text-sm rounded-lg md:rounded-xl mt-3 md:mt-4 bg-white outline-none resize-none"></textarea>
        </div>
        
        <button type="submit" id="submitBtn" class="w-full py-4 mt-2 bg-dsYellow text-dsNavy text-base md:text-lg font-extrabold rounded-xl shadow-md active:scale-[0.98] transition">
          🚀 희망도서 신청 완료하기
        </button>
      </form>
    </section>
  </main>

  <footer class="text-center text-[10px] md:text-xs text-slate-400 mt-10 pb-6 font-medium">
    <p>인천동수중학교 책사랑 도서관 📖</p>
  </footer>

  <script>
    // ★★★ 여기에 기존 웹 앱 URL 주소를 그대로 붙여넣으세요! ★★★
    const GAS_URL = "https://script.google.com/macros/s/AKfycbz4Hc84Kji36UrBVqdAY_B7NRDvNrIQ77Bc4VXnt7zu2RdQvq7G5b_p4e45QnigHHNp/exec"; 
    
    // 1. 소장도서 검색 (청구기호 적용)
    async function searchOwnedBooks() {
      const q = document.getElementById('ownedSearchInput').value.trim();
      if (!q) return alert("검색할 책 제목을 입력해주세요.");
      const resultBox = document.getElementById('ownedResultBox');
      const list = document.getElementById('ownedResultList');
      resultBox.classList.remove('hidden');
      list.innerHTML = `<div class="p-4 text-center text-xs md:text-sm text-slate-500">도서관 서재를 찾아보는 중입니다... 🕵️‍♂️</div>`;
      try {
        const res = await fetch(`${GAS_URL}?action=searchOwned&query=${encodeURIComponent(q)}`);
        const json = await res.json();
        
        if (json.data && json.data.length > 0) {
          list.innerHTML = json.data.map(b => `
            <div class="p-3 bg-white border border-slate-200 rounded-xl text-xs md:text-sm flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2 shadow-sm mb-2">
              <div>
                <div class="font-bold text-dsNavy text-sm md:text-base">${b.title}</div> 
                <div class="text-slate-500 mt-0.5">${b.author} | ${b.publisher}</div>
                <div class="text-[10px] md:text-xs text-slate-400 mt-1">출판년도: ${b.year || '-'} | 청구기호: <b>${b.callNo || '-'}</b></div>
              </div>
              <span class="bg-dsSky text-dsNavy px-2.5 py-1.5 rounded-lg text-[10px] md:text-xs font-bold text-center self-start sm:self-auto shrink-0">도서관 소장중</span>
            </div>
          `).join('');
        } else {
          list.innerHTML = `<div class="p-4 bg-white border border-slate-200 rounded-xl text-xs md:text-sm font-bold flex flex-col items-center text-center text-slate-600 shadow-sm gap-1"><span>🎉 '${q}' 은(는) 도서관에 없네요!</span><span class="text-dsNavy font-medium">아래에서 신청해주세요.</span></div>`;
        }
      } catch (err) {
        list.innerHTML = `<div class="text-red-500 text-xs md:text-sm p-4 text-center">검색 중 오류가 발생했어요. 잠시 후 다시 시도해주세요.</div>`;
      }
    }

    // 2. 카카오 도서 검색 API
    async function searchKakaoBook() {
      const q = document.getElementById('kakaoQuery').value.trim();
      if (!q) return alert("도서명을 입력하세요.");

      const resBox = document.getElementById('kakaoResults');
      resBox.classList.remove('hidden');
      resBox.innerHTML = `<div class="p-4 text-center text-xs md:text-sm text-slate-500">카카오 서버에서 책을 찾는 중입니다... 📚</div>`;

      try {
        const res = await fetch(`${GAS_URL}?action=searchKakao&query=${encodeURIComponent(q)}`);
        const data = await res.json();
        
        // 에러 방어 처리
        if (data.errorCode || data.errorType) {
          resBox.innerHTML = `<div class="p-4 bg-white rounded-xl text-center text-xs md:text-sm text-red-500 border border-red-100">API 통신 중 에러가 발생했습니다.<br>직접 폼에 적어서 신청해주세요!</div>`;
          return;
        }

        const items = data.documents;
        if (!items || items.length === 0) {
          resBox.innerHTML = `<div class="p-4 bg-white rounded-xl text-xs md:text-sm text-slate-500 text-center border border-slate-200">검색 결과가 없어요. 직접 폼에 적어주세요.</div>`;
          return;
        }

        resBox.innerHTML = items.map(i => {
          // 카카오 데이터 규격에 맞게 파싱
          const title = i.title || "-";
          const author = (i.authors && i.authors.length > 0) ? i.authors.join(', ') : "-";
          const publisher = i.publisher || "-";
          const price = (i.sale_price && i.sale_price > 0) ? i.sale_price : (i.price || 0);
          const cover = i.thumbnail || "https://via.placeholder.com/50x70";
          // 카카오는 10자리, 13자리 ISBN을 공백으로 구분해서 주므로 13자리만 가져옵니다.
          const isbn = i.isbn ? i.isbn.split(' ').pop() : ""; 
          
          const bookData = { title, author, publisher, price, isbn };

          return `
          <div onclick='selBook(${JSON.stringify(bookData).replace(/'/g,"&apos;")})' class="p-2.5 md:p-3 bg-white border border-slate-200 hover:border-dsSky rounded-xl cursor-pointer flex gap-3 items-center transition mb-2 active:bg-slate-50">
            <img src="${cover}" class="w-10 h-14 md:w-12 md:h-16 object-cover rounded-md shadow-sm border border-slate-100 shrink-0">
            <div class="text-xs md:text-sm flex-1 min-w-0">
              <div class="font-bold text-slate-800 truncate">${title}</div>
              <div class="text-slate-500 text-[10px] md:text-xs mt-0.5 truncate">${author} | ${publisher}</div>
              <div class="text-dsNavy font-black mt-1">${Number(price).toLocaleString()}원</div>
            </div>
            <button type="button" class="text-[10px] md:text-xs bg-slate-100 text-slate-600 px-2.5 py-1.5 md:px-3 md:py-2 rounded-lg font-bold shrink-0">선택</button>
          </div>
          `
        }).join('');

      } catch (err) {
        console.error("Kakao Search Error:", err);
        resBox.innerHTML = `<div class="p-4 bg-white rounded-xl text-center text-xs md:text-sm text-red-500 border border-red-100">서버와 통신 중 오류가 발생했습니다.<br>직접 입력하여 신청해주세요.</div>`;
      }
    }

    // 3. 폼 자동 채우기
    function selBook(b) {
      document.getElementById('title').value = b.title || ''; 
      document.getElementById('author').value = b.author || '';
      document.getElementById('publisher').value = b.publisher || ''; 
      document.getElementById('price').value = b.price ? Number(b.price).toLocaleString() : '';
      document.getElementById('isbn').value = b.isbn || ''; 
      document.getElementById('kakaoResults').classList.add('hidden');
      
      document.getElementById('wishForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // 4. 신청서 전송
    async function submitWishlist(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerHTML = "전송중... 🚀";
      btn.disabled = true;
      btn.classList.add('opacity-70');

      const payload = {
        action: "addRequest", 
        role: document.getElementById('role').value, 
        name: document.getElementById('name').value,
        gradeClass: document.getElementById('grade').value, 
        title: document.getElementById('title').value,
        author: document.getElementById('author').value, 
        publisher: document.getElementById('publisher').value,
        price: document.getElementById('price').value, 
        isbn: document.getElementById('isbn').value, 
        reason: document.getElementById('reason').value
      };
      
      try {
        await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) });
        alert("🎉 희망도서 신청이 완료되었습니다!");
        document.getElementById('wishForm').reset();
        document.getElementById('ownedResultBox').classList.add('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        alert("통신 오류가 발생했습니다. 잠시 후 다시 시도해주세요.");
      } finally {
        btn.innerHTML = "🚀 희망도서 신청 완료하기";
        btn.disabled = false;
        btn.classList.remove('opacity-70');
      }
    }
  </script>
</body>
</html>
